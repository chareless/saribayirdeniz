<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MMDb">
  <!--
    Projektör huzmesi. Özgün çizim — hazır ikon paketi kullanılmadı, dolayısıyla
    lisans ya da atıf yükümlülüğü yok.

    16 pikselde okunabilmesi için üç kaba kütleden fazlası yok: lens dairesi,
    açılan huzme ve perde. İnce çizgi ve küçük detay bu boyutta kayboluyor.

    Renkler sabit: favicon sayfanın CSS değişkenlerini göremiyor. Kehribar hem
    açık hem koyu sekme çubuğunda okunuyor.
  -->
  <rect width="32" height="32" rx="7" fill="#17162A"/>

  <!-- huzme: lensten perdeye doğru açılıyor -->
  <path d="M11 16 L26 7.5 V24.5 Z" fill="#B26B0E" opacity=".45"/>
  <path d="M11 16 L26 11 V21 Z" fill="#B26B0E"/>

  <!-- lens -->
  <circle cx="8.5" cy="16" r="4.5" fill="#F3F2F7"/>
  <circle cx="8.5" cy="16" r="2" fill="#17162A"/>
</svg>
